<!DOCTYPE html>
<html>
<head>
  <title>GitHub Live Search</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f4f4;
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 300px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    #status {
      margin-bottom: 15px;
      color: #555;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 12px;
      margin-bottom: 10px;

      background: white;
      border-radius: 5px;
    }

    img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

  </style>
</head>
<body>

  <h2>GitHub User Search</h2>

  <input
    id="q"
    placeholder="Search GitHub users..."
  />

  <div id="status"></div>

  <ul id="results"></ul>

  <script src="script.js"></script>


</body>
</html>
